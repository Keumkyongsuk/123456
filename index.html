<title>제주 가족여행 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 여행 예약앱 구조 — 상단 로고바, 배너 캐러셀, 아이콘 바로가기, 카드 리스트, 하단 탭 */
:root{
  --bg:#f3f7f8; --card:#ffffff; --ink:#10293a; --sub:#5b7180; --line:#e0e8ec;
  --sea:#0b7a96; --sea-deep:#0a4c63; --sea-soft:#e1f2f6;
  --tang:#f27a14; --tang-soft:#fff0e0;
  --ok:#1f9d6b; --ok-soft:#e0f5ec; --warn:#c2410c;
  --k-drive:#6b7f8c; --k-walk:#1f9d6b; --k-museum:#7a5af0; --k-food:#f27a14; --k-ferry:#0b7a96; --k-stay:#d6457f;
  --font:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a23; --card:#14262f; --ink:#e8f1f5; --sub:#93a9b5; --line:#233842;
  --sea:#4cc3e0; --sea-deep:#0a3a4d; --sea-soft:#14323d;
  --tang:#ff9a40; --tang-soft:#3a2a18;
  --ok:#4fd1a0; --ok-soft:#14352b; --warn:#ff9a6b;
  --k-drive:#9bb0bc; --k-walk:#4fd1a0; --k-museum:#a592ff; --k-food:#ff9a40; --k-ferry:#4cc3e0; --k-stay:#ff7fae;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a23; --card:#14262f; --ink:#e8f1f5; --sub:#93a9b5; --line:#233842;
  --sea:#4cc3e0; --sea-deep:#0a3a4d; --sea-soft:#14323d;
  --tang:#ff9a40; --tang-soft:#3a2a18;
  --ok:#4fd1a0; --ok-soft:#14352b; --warn:#ff9a6b;
  --k-drive:#9bb0bc; --k-walk:#4fd1a0; --k-museum:#a592ff; --k-food:#ff9a40; --k-ferry:#4cc3e0; --k-stay:#ff7fae;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
a{color:var(--sea)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-weight:900;font-size:18px;letter-spacing:-.02em;color:var(--sea)}
.logo b{color:var(--tang);font-weight:900}
.who{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.who button{padding:3px 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--sub)}
.who button[aria-pressed="true"]{background:var(--sea);color:#fff}

main{max-width:640px;margin:0 auto;padding-block:14px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:70vh}
.view{display:none;flex-direction:column;gap:18px}
.view.on{display:flex}
h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h small{color:var(--sub);font-size:13px}
.more{font-size:13px;color:var(--sea);font-weight:500}

/* banner carousel */
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.banners::-webkit-scrollbar{display:none}
.bn{scroll-snap-align:center;flex:0 0 88%;min-height:170px;border-radius:16px;padding:18px;color:#fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.bn svg.wave{position:absolute;inset:auto 0 0 0;width:100%;height:56%;opacity:.22}
.bn h3,.bn p,.bn .tag{position:relative;z-index:1}
.bn .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.bn .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,22,32,.15) 0%,rgba(6,22,32,.78) 100%)}
.cover{position:relative;border-radius:14px;overflow:hidden;min-height:150px;display:flex;align-items:flex-end;color:#fff;background:var(--sea-deep)}
.cover .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,22,32,.05) 20%,rgba(6,22,32,.82) 100%)}
.cover .cap{position:relative;padding:14px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.cover .cap b{font-size:17px;font-weight:900;letter-spacing:-.02em}
.thumbs{display:flex;gap:6px;margin-top:8px}
.thumbs img{flex:1 1 0;min-width:0;height:118px;object-fit:cover;border-radius:10px;background:var(--line)}
.fthumb{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.bn .tag{align-self:flex-start;background:rgba(255,255,255,.22);border-radius:999px;font-size:12px;font-weight:500;padding:2px 10px;margin-bottom:auto}
.bn h3{margin:0;font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.25;text-wrap:balance}
.bn p{margin:0;font-size:13px;opacity:.92}
.bn.a{background:linear-gradient(135deg,#0b7a96,#0a4c63)}
.bn.b{background:linear-gradient(135deg,#f27a14,#c2410c)}
.bn.c{background:linear-gradient(135deg,#3a8f6b,#1d5b45)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sea);width:16px;border-radius:4px}

/* quick links */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;font-size:13px;font-weight:500;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.quick .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea)}
.quick button:nth-child(2) .ic{background:var(--tang-soft);color:var(--tang)}
.quick button:nth-child(3) .ic{background:var(--ok-soft);color:var(--ok)}

/* cards & lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.list{display:flex;flex-direction:column;gap:10px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fact{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fact small{color:var(--sub);font-size:12px}
.fact b{font-size:16px;font-weight:700}
.notice{display:flex;flex-direction:column}
.notice li{list-style:none;padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.notice li:first-child{border-top:0}
.notice ul{margin:0;padding:0}
.notice .by{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--sea-soft);color:var(--sea);margin-top:2px}
.notice .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.notice time{display:block;font-size:12px;color:var(--sub)}
.empty{padding:22px 16px;text-align:center;color:var(--sub);font-size:14px}

/* day tabs */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 74px;border-radius:14px;padding:8px 6px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.3}
.day small{font-size:12px;color:var(--sub)}
.day b{font-size:15px}
.day[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.day[aria-pressed="true"] small{color:#d6f1f8}
.theme-line{padding:12px 14px;background:var(--sea-soft);border-radius:12px;font-size:14px;color:var(--ink)}
.theme-line b{color:var(--sea)}

/* timeline */
.tl{display:flex;flex-direction:column}
.ti{display:grid;grid-template-columns:50px 1fr;gap:10px}
.ti .tm{font-size:13px;font-weight:700;text-align:right;padding-top:14px;font-variant-numeric:tabular-nums;color:var(--sub)}
.ti .bd{border-left:2px solid var(--line);padding:0 0 12px 14px;position:relative}
.ti .bd::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--kc,var(--k-drive));border:2px solid var(--bg)}
.ti.done .nm{text-decoration:line-through;color:var(--sub)}
.ti .box{padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.ti .txt{flex:1;min-width:0;text-align:left}
.kind{display:inline-block;font-size:11px;font-weight:700;color:var(--kc);margin-bottom:1px}
.nm{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.mm{font-size:13px;color:var(--sub);overflow-wrap:anywhere;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--bg);color:var(--sub);text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.pill.map{background:var(--sea-soft);color:var(--sea);font-weight:500}
.pill.map svg{width:13px;height:13px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;margin-top:2px}
.chk svg{width:16px;height:16px;stroke-width:3}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.k-drive{--kc:var(--k-drive)}.k-walk{--kc:var(--k-walk)}.k-museum{--kc:var(--k-museum)}.k-food{--kc:var(--k-food)}.k-ferry{--kc:var(--k-ferry)}.k-stay{--kc:var(--k-stay)}

.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;border:1.5px dashed var(--sea);color:var(--sea);font-weight:700;width:100%}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;width:52px;height:52px;border-radius:50%;background:var(--tang);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.fab svg{width:26px;height:26px;stroke-width:2.4}

/* stay / food cards */
.area{padding:16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(135deg,var(--sea-soft),var(--card))}
.area h3{margin:0;font-size:16px}
.area p{margin:0;font-size:14px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--sea);color:#fff;border-color:var(--sea)}
.item{padding:14px;display:flex;gap:12px;align-items:flex-start}
.item .txt{flex:1;min-width:0;text-align:left}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--ok-soft);color:var(--ok);margin-left:6px;vertical-align:2px}
.vote{display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--sub);flex:none;min-width:40px}
.vote svg{width:24px;height:24px}
.vote[aria-pressed="true"]{color:var(--k-stay)}
.vote[aria-pressed="true"] svg{fill:var(--k-stay)}

/* budget */
.bud-top{padding:16px;display:flex;flex-direction:column;gap:10px}
.bud-top .big{font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bud-top .big small{font-size:14px;font-weight:500;color:var(--sub)}
.bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bar .pl{background:var(--sea-soft)}
.bar .ac{background:var(--sea)}
.bar.over .ac{background:var(--warn)}
.row2{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.bi{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left}
.bi .cat{font-size:12px;color:var(--sub)}
.bi .amt{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--sub);flex:none}
.bi .amt b{display:block;font-size:15px;color:var(--ink)}
.cl-g{display:flex;flex-direction:column}
.cl{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.cl:first-child{border-top:0}
.cl.done span{text-decoration:line-through;color:var(--sub)}
.cl .chk{margin:0}

/* bottom nav */
.tabs{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:500;color:var(--sub)}
.tabs button[aria-selected="true"]{color:var(--sea);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,22,.55);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;inset:auto 0 0 0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;display:none;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:640px}
.sheet.on{display:block}
.sheet h3{margin:0 0 12px;font-size:17px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700;color:var(--sub)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;background:var(--sea);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink);flex:0 0 auto;padding-inline:18px}
.btn.del{background:var(--bg);color:var(--warn);flex:0 0 auto;padding-inline:16px}
.btn.del[data-arm="1"]{background:var(--warn);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;max-width:88%;text-align:center;display:none}
.toast.on{display:block}
.ro{padding:10px 14px;border-radius:12px;background:var(--tang-soft);color:var(--ink);font-size:13px}
.sync{font-size:12px;color:var(--sub);text-align:center}
@media (prefers-reduced-motion:no-preference){.banners{scroll-behavior:smooth}}
</style>

<header class="top"><div class="top-in">
  <div class="logo">JEJU<b>·</b>FAMILY</div>
  <div class="who" id="who" role="group" aria-label="지금 쓰는 사람"></div>
</div></header>

<main id="main">
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-stay"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-money"></section>
</main>

<nav class="tabs" aria-label="메뉴"><div class="tabs-in" id="tabs"></div></nav>
<button class="fab" id="fab" aria-label="추가" hidden></button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"></div>
<div class="toast" id="toast" role="status"></div>

};

/* ---------- db ---------- */
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2600)}
function fail(e){
  var c=e&&e.code;
  toast(c==='invalid_argument'?'수정 권한이 없어요. 공유 설정에서 편집 권한으로 초대해 주세요.':'저장하지 못했어요. 잠시 후 다시 눌러 주세요.');
}
function save(col,id,data){
  if(!db){toast('저장소에 연결되지 않았어요. 로그인 상태를 확인해 주세요.');return Promise.resolve()}
  var ref=id?db.collection(col).doc(id):db.collection(col).doc();
  return ref.set(data).catch(fail);
}
function patch(col,id,data){
  if(!db)return Promise.resolve();
  return db.collection(col).doc(id).update(data).catch(fail);
}
function remove(col,id){return db?db.collection(col).doc(id).delete().catch(fail):Promise.resolve()}
function find(col,id){return S[col].filter(function(x){return x.id===id})[0]}

function subscribe(col){
  db.collection(col).onSnapshot(function(snap){
    S[col]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    loaded[col]=true;render();
  },function(){loaded[col]=true;render()});
}

function dDay(){
  var ms=START-Date.now();
  if(ms>0){var d=Math.ceil(ms/864e5);return 'D-'+d}
  var n=Math.floor((Date.now()-START)/864e5)+1;return n<=4?('여행 '+n+'일차'):'다녀왔어요'
}
function todayDay(){
  var n=Math.floor((Date.now()-START)/864e5)+1;return (n>=1&&n<=4)?n:1
}

  $('#sheet').innerHTML=h;$('#sheet').classList.add('on');$('#scrim').classList.add('on');

      d[f.k]=(f.num||f.t==='number')&&raw!==''?Number(raw):(f.t==='number'?'':raw.trim?raw.trim():raw);

    var col=cur.col,id=cur.id;closeSheet();remove(col,id).then(function(){toast('삭제했어요')});
  });
}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');cur=null}
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur)closeSheet()});

/* ---------- actions ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a,id=t.dataset.id,c=t.dataset.c;
  if(a==='tab'){ui.tab=t.dataset.t;renderChrome();render();window.scrollTo(0,0)}
  else if(a==='day'){ui.day=Number(t.dataset.d);render()}
  else if(a==='ff'){ui.foodFilter=t.dataset.f;render()}
  else if(a==='who'){ui.who=t.dataset.n;try{localStorage.setItem('jeju.who',ui.who)}catch(x){}renderChrome()}
  else if(a==='edit'){openSheet(c,id)}
  else if(a==='add'){openSheet(c||t.dataset.c,null)}
  else if(a==='done'){var p=find('plan',id);if(p)patch('plan',id,{done:!p.done})}
  else if(a==='tried'){var f=find('food',id);if(f)patch('food',id,{tried:!f.tried})}
  else if(a==='chk'){var k=find('check',id);if(k)patch('check',id,{done:!k.done})}
  else if(a==='vote'){
    var s=find('stay',id);if(!s)return;
    if(!uid){toast('로그인한 상태에서 투표할 수 있어요.');return}
    var v=(s.votes||[]).slice(),i=v.indexOf(uid);if(i>=0)v.splice(i,1);else v.push(uid);
    patch('stay',id,{votes:v});
  }
});
